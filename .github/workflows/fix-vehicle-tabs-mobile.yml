name: Fix mobile vehicle tabs
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/fix-vehicle-tabs-mobile.yml' ]
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix narrow-screen vehicle tabs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          old='@media(max-width:380px){.summary{grid-template-columns:1fr 1fr 1fr}.km-value{font-size:28px}.vehicle-tab{min-width:195px}}'
          new='@media(max-width:380px){.summary{grid-template-columns:1fr 1fr 1fr}.km-value{font-size:28px}.vehicle-tab{min-width:0!important;padding:11px 9px}.vehicle-tab strong{font-size:13px}.vehicle-tab span{font-size:10.5px}}'
          assert old in s, 'old narrow-screen vehicle rule not found'
          s=s.replace(old,new,1)
          s=s.replace('.vehicle-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:visible;', '.vehicle-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:hidden;',1)
          assert 'min-width:195px' not in s
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))' in s
          p.write_text(s)
          PY
      - name: Verify frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('app/src/main/assets/index.html').read_text()
          js=html.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/carservice.js').write_text(js)
          PY
          node --check /tmp/carservice.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-vehicle-tabs-mobile.yml
          git add app/src/main/assets/index.html
          git commit -m 'Fix vehicle selector on narrow screens'
          git push
      - name: Start signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
