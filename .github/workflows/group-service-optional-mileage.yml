name: Group service and allow optional mileage

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'NoMercy0805/CarService'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI and mileage changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text()

          # Permanently use the simpler wording in source too.
          s = s.replace('Nebenaggregateriemen-Kit wechseln', 'Keilrippenriemen wechseln')
          s = s.replace('Nebenaggregateriemen wechseln', 'Keilrippenriemen wechseln')
          s = s.replace('Nebenaggregateriemen-Kit', 'Keilrippenriemen')
          s = s.replace('Nebenaggregateriemen', 'Keilrippenriemen')

          # Small section headings inside Peugeot-Service.
          if '.service-group-title{' not in s:
              marker='@media(max-width:380px)'
              css='.service-group{margin:4px 0 14px}.service-group-title{font-size:11px;font-weight:800;letter-spacing:.25px;color:var(--muted);text-transform:uppercase;padding:8px 2px 5px;border-bottom:1px solid var(--rule);margin-bottom:2px}\n'
              assert marker in s
              s=s.replace(marker,css+marker,1)

          if 'function serviceChecklistGrouped(items)' not in s:
              marker='function openServiceChecklist(){'
              helper='''function serviceGroupFor(item){\n  const id=item.taskId||"";\n  const name=item.name||"";\n  if(["fuel","air","cabin"].includes(id)||/motoröl|ölfilter|filter/i.test(name)) return "Öl & Filter";\n  if(["brakefluid","coolantph"].includes(id)||/flüssigkeit|kühlmittel/i.test(name)) return "Flüssigkeiten";\n  if(["timing","auxbelt"].includes(id)||/zahnriemen|keilrippenriemen/i.test(name)) return "Riemen";\n  if(["dpf","fapadd","adblue"].includes(id)||/partikelfilter|fap|adblue|scr/i.test(name)) return "Abgas & AdBlue";\n  if(id.startsWith("custom_")) return "Weitere Arbeiten";\n  return "Kontrollen";\n}\nfunction serviceChecklistGrouped(items){\n  const order=["Öl & Filter","Flüssigkeiten","Riemen","Abgas & AdBlue","Kontrollen","Weitere Arbeiten"];\n  const groups={};\n  items.forEach(item=>{const g=serviceGroupFor(item);(groups[g]||(groups[g]=[])).push(item);});\n  return order.filter(g=>groups[g]?.length).map(g=>`<div class="service-group"><div class="service-group-title">${esc(g)}</div>${serviceChecklistRows(groups[g])}</div>`).join("");\n}\n'''
              assert marker in s
              s=s.replace(marker,helper+marker,1)

          s=s.replace('?serviceChecklistRows(items)', '?serviceChecklistGrouped(items)')

          # Manual maintenance: mileage may be blank.
          old='const mileage=Number(document.getElementById("manualEntryMileage").value||0);'
          new='const mileageRaw=document.getElementById("manualEntryMileage").value.trim();\n  const mileage=mileageRaw===""?null:Number(mileageRaw);'
          assert old in s
          s=s.replace(old,new,1)
          start=s.index('function saveManualEntry(){')
          end=s.index('function openEntry(',start)
          block=s[start:end]
          oldcheck='if(!mileage){alert("Bitte den Kilometerstand eintragen.");return;}'
          assert oldcheck in block
          block=block.replace(oldcheck,'if(mileage!==null&&(!Number.isFinite(mileage)||mileage<0)){alert("Bitte einen gültigen Kilometerstand eintragen oder das Feld leer lassen.");return;}',1)
          s=s[:start]+block+s[end:]

          # History should not show "0 km" for entries saved without mileage.
          s=s.replace('${fmtDate(rec.date)} · ${fmtKm(rec.mileage)} km','${fmtDate(rec.date)}${rec.mileage!==null&&rec.mileage!==undefined&&rec.mileage!==""?" · "+fmtKm(rec.mileage)+" km":""}')
          s=s.replace('${fmtDate(rec.date)} \\u00b7 ${fmtKm(rec.mileage)} km','${fmtDate(rec.date)}${rec.mileage!==null&&rec.mileage!==undefined&&rec.mileage!==""?" · "+fmtKm(rec.mileage)+" km":""}')

          # History editing: keep mileage optional if the edit form exists.
          for field_id in ('editHistoryMileage','historyEditMileage'):
              old=f'const mileage=Number(document.getElementById("{field_id}").value||0);'
              if old in s:
                  new=f'const mileageRaw=document.getElementById("{field_id}").value.trim();\n  const mileage=mileageRaw===""?null:Number(mileageRaw);'
                  s=s.replace(old,new,1)
                  pos=s.index(new)
                  chk=s.find('if(!mileage){alert("Bitte den Kilometerstand eintragen.");return;}',pos)
                  if chk!=-1 and chk-pos<1500:
                      s=s[:chk]+s[chk:].replace('if(!mileage){alert("Bitte den Kilometerstand eintragen.");return;}','if(mileage!==null&&(!Number.isFinite(mileage)||mileage<0)){alert("Bitte einen gültigen Kilometerstand eintragen oder das Feld leer lassen.");return;}',1)

          p.write_text(s)
          assert 'function serviceChecklistGrouped(items)' in s
          assert '?serviceChecklistGrouped(items)' in s
          assert 'mileageRaw=document.getElementById("manualEntryMileage")' in s
          assert 'Nebenaggregateriemen' not in s
          PY

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js

      - name: Commit app changes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          git rm .github/workflows/group-service-optional-mileage.yml
          git commit -m "Group Peugeot service and allow maintenance without mileage"
          git push
