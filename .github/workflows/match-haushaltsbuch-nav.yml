name: Match Haushaltsbuch navigation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/match-haushaltsbuch-nav.yml
      - .github/scripts/patch_nav.py

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply navigation patch
        run: python3 .github/scripts/patch_nav.py

      - name: Verify frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text()
          js = html.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/carservice.js').write_text(js)
          PY
          node --check /tmp/carservice.js

      - name: Commit UI change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/match-haushaltsbuch-nav.yml .github/scripts/patch_nav.py
          git add app/src/main/assets/index.html
          git commit -m 'Match navigation bar and settings icon to Haushaltsbuch'
          git push

      - name: Start signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
