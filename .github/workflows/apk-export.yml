name: Export latest CarService APK

on:
  push:
    paths:
      - '.github/workflows/apk-export.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  export:
    if: github.repository == 'NoMercy0805/CarService'
    runs-on: ubuntu-latest
    steps:
      - name: Download latest release APK
        run: |
          mkdir -p out
          gh release download carservice-latest --repo NoMercy0805/CarService --pattern CarService.apk --dir out
          sha256sum out/CarService.apk
          stat -c '%s bytes' out/CarService.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarService-latest-apk
          path: out/CarService.apk
          if-no-files-found: error
          compression-level: 0
