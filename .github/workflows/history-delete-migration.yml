name: Add history delete support

'on':
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch app
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Verify JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text()
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/carservice.js').write_text(js)
          assert 'data-delete-record' in s
          assert 'function deleteHistoryRecord' in s
          assert 'serviceGroup' in s
          assert 'Erledigt eintragen' not in s
          assert 'openLogBtn' not in s
          PY
          node --check /tmp/carservice.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git commit -m 'Allow deleting incorrect history entries'
          git push
      - name: Start signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
