name: Verify CarService Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project builds
        run: gradle :app:assembleRelease --no-daemon

      - name: Signing information
        run: |
          echo "This repository only validates the source build."
          echo "Installable CarService APKs are signed with the fixed keystore by the private Haushaltsbuch signing workflow."
