name: Build signed CarService APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'NoMercy0805/CarService' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate vehicle/profile mapping
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          mapping = json.loads(Path('vehicle-identification.json').read_text())['vehicles']
          html = Path('app/src/main/assets/index.html').read_text()

          assert mapping['508']['hsn'] == '3003' and mapping['508']['tsn'] == 'AOK'
          assert mapping['508']['profiles'] == ['508_early', '508_late']
          assert mapping['2008']['hsn'] == '3003' and mapping['2008']['tsn'] == 'AUH'
          assert mapping['2008']['profiles'] == ['2008_normal', '2008_severe']

          assert 'const options=v.id==="508"?["508_early","508_late"]:["2008_normal","2008_severe"];' in html
          assert 'id:"508",name:"Peugeot 508 SW"' in html and 'profile:"508_late"' in html
          assert 'id:"2008",name:"Peugeot 2008"' in html and 'profile:"2008_normal"' in html

          print('Vehicle/profile mapping OK: 3003/AOK -> 508 profiles; 3003/AUH -> 2008 profiles')
          PY

      - name: Use simple belt wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text()
          s = s.replace('Nebenaggregateriemen-Kit wechseln', 'Keilrippenriemen wechseln')
          s = s.replace('Nebenaggregateriemen wechseln', 'Keilrippenriemen wechseln')
          s = s.replace('Nebenaggregateriemen-Kit', 'Keilrippenriemen')
          s = s.replace('Nebenaggregateriemen', 'Keilrippenriemen')
          p.write_text(s)
          assert 'Nebenaggregateriemen' not in s
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project builds
        run: gradle :app:assembleRelease --no-daemon

  build-signed:
    if: github.repository == 'NoMercy0805/CarService' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate vehicle/profile mapping
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          mapping = json.loads(Path('vehicle-identification.json').read_text())['vehicles']
          html = Path('app/src/main/assets/index.html').read_text()

          assert mapping['508']['hsn'] == '3003' and mapping['508']['tsn'] == 'AOK'
          assert mapping['508']['profiles'] == ['508_early', '508_late']
          assert mapping['2008']['hsn'] == '3003' and mapping['2008']['tsn'] == 'AUH'
          assert mapping['2008']['profiles'] == ['2008_normal', '2008_severe']

          assert 'const options=v.id==="508"?["508_early","508_late"]:["2008_normal","2008_severe"];' in html
          assert 'id:"508",name:"Peugeot 508 SW"' in html and 'profile:"508_late"' in html
          assert 'id:"2008",name:"Peugeot 2008"' in html and 'profile:"2008_normal"' in html

          print('Vehicle/profile mapping OK: 3003/AOK -> 508 profiles; 3003/AUH -> 2008 profiles')
          PY

      - name: Use simple belt wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text()
          s = s.replace('Nebenaggregateriemen-Kit wechseln', 'Keilrippenriemen wechseln')
          s = s.replace('Nebenaggregateriemen wechseln', 'Keilrippenriemen wechseln')
          s = s.replace('Nebenaggregateriemen-Kit', 'Keilrippenriemen')
          s = s.replace('Nebenaggregateriemen', 'Keilrippenriemen')
          p.write_text(s)
          assert 'Nebenaggregateriemen' not in s
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Repository secret DEBUG_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore

      - name: Verify fixed signing key
        run: |
          FINGERPRINT=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:" | awk '{print $2}')
          EXPECTED="90:D7:94:A6:9C:A8:58:88:15:18:3E:FA:11:12:02:D6:54:A9:21:8C"
          echo "Signing fingerprint: $FINGERPRINT"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "ERROR: signing key does not match the established CarService key."
            exit 1
          fi

      - name: Set increasing version code
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          echo "Using versionCode ${VERSION_CODE}"

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign and verify APK
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/sign.log"
          report() {
            code=$?
            sleep 1
            MSG=$(tail -n 40 "$LOG" 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Signierschritt fehlgeschlagen (exit ${code})::${MSG}"
          }
          trap report ERR
          exec > >(tee "$LOG") 2>&1

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          test -x "$APKSIGNER"
          ls -l app/build/outputs/apk/release
          UNSIGNED=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          echo "unsigned: $UNSIGNED"
          test -n "$UNSIGNED"
          OUT="app/build/outputs/apk/release/CarService.apk"
          rm -f "$OUT"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" > "$RUNNER_TEMP/verify.txt" 2>&1 || { cat "$RUNNER_TEMP/verify.txt"; exit 1; }
          cat "$RUNNER_TEMP/verify.txt"
          APK_FP=$(grep -i 'certificate SHA-1 digest' "$RUNNER_TEMP/verify.txt" | head -1 | sed 's/.*: *//' | tr -d ':' | tr 'a-f' 'A-F')
          EXPECTED="90D794A69CA8588815183EFA111202D654A9218C"
          echo "APK fingerprint: $APK_FP"
          if [ "$APK_FP" != "$EXPECTED" ]; then
            echo "ERROR: APK signature fingerprint mismatch: $APK_FP"
            exit 1
          fi

      - name: Publish latest signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/CarService.apk"
          if gh release view carservice-latest >/dev/null 2>&1; then
            gh release upload carservice-latest "$APK#CarService.apk" --clobber
          else
            gh release create carservice-latest "$APK#CarService.apk" \
              --target main \
              --title "CarService – signierte APK" \
              --notes "Automatisch gebaute und mit dem festen CarService-Schlüssel signierte APK."
          fi
