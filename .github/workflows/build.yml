name: Build signed CarService APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project builds
        run: gradle :app:assembleRelease --no-daemon

  build-signed:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Repository secret DEBUG_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore

      - name: Verify fixed signing key
        run: |
          FINGERPRINT=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:" | awk '{print $2}')
          EXPECTED="90:D7:94:A6:9C:A8:58:88:15:18:3E:FA:11:12:02:D6:54:A9:21:8C"
          echo "Signing fingerprint: $FINGERPRINT"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "ERROR: signing key does not match the established CarService key."
            exit 1
          fi

      - name: Set increasing version code
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          echo "Using versionCode ${VERSION_CODE}"

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign and verify APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          UNSIGNED=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -n "$UNSIGNED"
          OUT="app/build/outputs/apk/release/CarService.apk"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUT"
          APK_FP=$("$APKSIGNER" verify --print-certs "$OUT" | awk -F': ' '/certificate SHA-1 digest/ {print toupper($2); exit}')
          APK_FP=${APK_FP//:/}
          EXPECTED="90D794A69CA8588815183EFA111202D654A9218C"
          if [ "$APK_FP" != "$EXPECTED" ]; then
            echo "ERROR: APK signature fingerprint mismatch: $APK_FP"
            exit 1
          fi

      - name: Publish latest signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/CarService.apk"
          if gh release view carservice-latest >/dev/null 2>&1; then
            gh release upload carservice-latest "$APK#CarService.apk" --clobber
          else
            gh release create carservice-latest "$APK#CarService.apk" \
              --target main \
              --title "CarService – signierte APK" \
              --notes "Automatisch gebaute und mit dem festen CarService-Schlüssel signierte APK."
          fi
