name: Fix CarService service checklist routing

on:
  push:
    paths:
      - '.github/workflows/fix-service-checklist.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'NoMercy0805/CarService'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Peugeot service checklist routing and wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/assets/index.html')
          text = path.read_text(encoding='utf-8')
          def rep(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              text = text.replace(old, new, 1)
          old_base = 'const SERVICE_BASE_ITEMS = [\n  "Motoröl wechseln",\n  "Ölfilter ersetzen",\n  "Fahrzeug-Gesamtprüfung",\n  "Flüssigkeitsstände prüfen und ggf. auffüllen",\n  "Diagnose / Fehlerspeicher prüfen",\n  "Sicherheits- und Umweltkontrollen"\n];\nconst SERVICE_INSPECTION_ITEMS = [\n  "Bremsen prüfen",\n  "Reifen: Zustand, Profiltiefe und Luftdruck",\n  "Beleuchtung, Hupe und elektrische Funktionen",\n  "Wischer und Waschanlage",\n  "Batterie und Anschlüsse",\n  "Lenkung, Fahrwerk und Manschetten",\n  "Nebenaggregateriemen sichtprüfen",\n  "Undichtigkeiten, Unterboden und Abgasanlage"\n];'
          new_base = 'const SERVICE_BASE_ITEMS = [\n  "Motoröl wechseln",\n  "Ölfilter ersetzen",\n  "Flüssigkeitsstände prüfen und ggf. auffüllen",\n  "Elektronische Diagnose / Fehlerspeicher prüfen",\n  "Dieselfilter entwässern (falls vorgesehen)",\n  "Serviceanzeige zurücksetzen"\n];\nconst SERVICE_INSPECTION_ITEMS = [\n  "Innenraum: Hupe und Feststellbremse prüfen",\n  "Reifen: Zustand, Profiltiefe und Luftdruck prüfen",\n  "Beleuchtung und Signalanlage prüfen",\n  "Unterboden: Bremsanlage und Lenkung prüfen",\n  "Dichtheit von Leitungen, Kreisläufen und Getriebe prüfen",\n  "Pannenset / Reifendichtmittel: Verfallsdatum prüfen (falls vorhanden)",\n  "Scheibenwischer und Waschanlage prüfen",\n  "Batterie und Anschlüsse sichtprüfen"\n];'
          rep(old_base, new_base, 'service wording')
          old_open = 'function openEntry(taskId){\n  const v=vehicle(),rules=rulesFor(v),sel=document.getElementById("entryTask");\n  sel.innerHTML=rules.map(r=>`<option value="${r.id}" ${r.id===taskId?"selected":""}>${r.icon} ${esc(r.name)}</option>`).join("");\n  document.getElementById("entryDate").value=today();\n  document.getElementById("entryMileage").value=v.mileage||"";\n  document.getElementById("entryCost").value="";\n  document.getElementById("entryNote").value="";\n  openModal("entryModal");\n}'
          new_open = 'function openEntry(taskId){\n  if(taskId==="service"){openServiceChecklist();return;}\n  const v=vehicle(),rules=rulesFor(v),sel=document.getElementById("entryTask");\n  sel.innerHTML=`<option value="">Wartung auswählen …</option>`+rules.map(r=>`<option value="${r.id}" ${r.id===taskId?"selected":""}>${r.icon} ${esc(r.name)}</option>`).join("");\n  document.getElementById("entryDate").value=today();\n  document.getElementById("entryMileage").value=v.mileage||"";\n  document.getElementById("entryCost").value="";\n  document.getElementById("entryNote").value="";\n  sel.onchange=()=>{if(sel.value==="service"){closeModal("entryModal");openServiceChecklist();}};\n  openModal("entryModal");\n}'
          rep(old_open, new_open, 'service routing')
          rep('  const taskId=document.getElementById("entryTask").value;\n  const rule=rulesFor(v).find(r=>r.id===taskId);', '  const taskId=document.getElementById("entryTask").value;\n  if(!taskId){alert("Bitte eine Wartung auswählen.");return;}\n  if(taskId==="service"){closeModal("entryModal");openServiceChecklist();return;}\n  const rule=rulesFor(v).find(r=>r.id===taskId);', 'entry validation')
          rep('  document.querySelectorAll(".task[data-task]").forEach(el=>el.onclick=()=>openEntry(el.dataset.task));', '  document.querySelectorAll(".task[data-task]").forEach(el=>el.onclick=()=>el.dataset.task==="service"?openServiceChecklist():openEntry(el.dataset.task));', 'task routing')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'expected one inline script, found {len(scripts)}')
          Path('/tmp/carservice.js').write_text(scripts[0], encoding='utf-8')
          if 'if(taskId==="service"){openServiceChecklist();return;}' not in html:
              raise SystemExit('service routing fix missing')
          PY
          node --check /tmp/carservice.js

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git diff --cached --check
          git commit -m 'Route service entries through Peugeot checklist'
          git push
