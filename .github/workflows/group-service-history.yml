name: Group Peugeot service history
on:
  push:
    paths:
      - '.github/scripts/group-service-history.py'
      - '.github/workflows/group-service-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply grouped history patch
        run: python3 .github/scripts/group-service-history.py
      - name: Commit app change and remove helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html
          git rm .github/scripts/group-service-history.py
          git rm .github/workflows/group-service-history.yml
          git commit -m "Group Peugeot service entries in history"
          git push
