name: Simplify service and manual presets
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          echo ' ZXRyaWViZSAvIFNjaGFsdHVuZyByZXBhcmllcmVuIiwKICAiS2xpbWFh   xKQppZiAnci ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check /tmp/carservice.js
          grep -q 'MANUAL_PRESETS_COMMON' app/src/main/assets/index.html
          grep -q 'manualEntryPresets' app/src/main/assets/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git rm .github/workflows/simplify-service-manual-presets.yml
          git commit -m 'Simplify service checklist and add repair presets'
          git push
