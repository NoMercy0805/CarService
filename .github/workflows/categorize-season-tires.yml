name: Categorize seasonal tires
on:
  push:
    paths:
      - '.github/workflows/categorize-season-tires.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Categorize summer and winter tires
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          old='''  "Reifen komplett ersetzen",\n  "Reifen vorne ersetzen",\n  "Reifen hinten ersetzen",\n  "Reifendrucksensor (TPMS) ersetzen",'''
          new='''  "Sommerreifen komplett ersetzen",\n  "Sommerreifen vorne ersetzen",\n  "Sommerreifen hinten ersetzen",\n  "Winterreifen komplett ersetzen",\n  "Winterreifen vorne ersetzen",\n  "Winterreifen hinten ersetzen",\n  "Reifendrucksensor (TPMS) ersetzen",'''
          if old not in s:
              raise SystemExit('tire preset block not found')
          s=s.replace(old,new,1)
          # Give seasonal tires their own visible subgroups, while TPMS remains under Reifen & Räder.
          s=s.replace('''  if(/reifen|tpms/.test(n)) return "Reifen & Räder";''','''  if(/sommerreifen/.test(n)) return "Sommerreifen";\n  if(/winterreifen/.test(n)) return "Winterreifen";\n  if(/reifen|tpms/.test(n)) return "Reifen & Räder";''',1)
          old_order='''"Klima & Komfort","Reifen & Räder","Sonstiges"'''
          new_order='''"Klima & Komfort","Sommerreifen","Winterreifen","Reifen & Räder","Sonstiges"'''
          if old_order not in s:
              raise SystemExit('group order not found')
          s=s.replace(old_order,new_order,1)
          p.write_text(s)
          js='\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S))
          Path('/tmp/carservice.js').write_text(js)
          subprocess.run(['node','--check','/tmp/carservice.js'],check=True)
          print('seasonal tire groups OK')
          PY
      - name: Commit app change and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html
          git rm .github/workflows/categorize-season-tires.yml
          git commit -m "Categorize manual tire maintenance by season"
          git push
