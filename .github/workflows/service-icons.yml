name: Improve service icons

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch service icons and checklist defaults
        env:
          PATCH_B64: __PATCH_B64__
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Verify frontend
        run: |
          python -c 'import re,pathlib; s=pathlib.Path("app/src/main/assets/index.html").read_text(); m=re.search(r"<script>(.*)</script>",s,re.S); assert m; pathlib.Path("/tmp/app.js").write_text(m.group(1))'
          node --check /tmp/app.js
          grep -q 'const SERVICE_ICON_SVGS' app/src/main/assets/index.html
          grep -q 'service-task-icon brakefluid' app/src/main/assets/index.html
          ! grep -q 'data-service-task=.* checked' app/src/main/assets/index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git commit -m 'Improve service icons and manual checklist state'
          git push
