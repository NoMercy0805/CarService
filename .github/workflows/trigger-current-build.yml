name: Trigger current CarService build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/trigger-current-build.yml'

permissions:
  contents: write
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove trigger and build clean main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/trigger-current-build.yml
          git commit -m 'Remove one-time build trigger'
          git push
          gh workflow run build.yml --ref main
