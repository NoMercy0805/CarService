name: Fix history dialog labels

'on':
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Fix labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '<h3>Eintrag l\\u00f6schen?</h3>':'<h3>Eintrag l&ouml;schen?</h3>',
            'aria-label="Schlie\\u00dfen"':'aria-label="Schlie&szlig;en"',
            'Soll dieser Historien-Eintrag wirklich gel\\u00f6scht werden?':'Soll dieser Historien-Eintrag wirklich gel&ouml;scht werden?',
            '>L\\u00f6schen</button>':'>L&ouml;schen</button>'
          }
          for old,new in replacements.items():
            assert old in s, old
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'id="deleteHistoryModal"' app/src/main/assets/index.html
          grep -q 'confirmDeleteHistoryBtn' app/src/main/assets/index.html
          grep -q 'Eintrag l&ouml;schen?' app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/carservice.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/carservice.js
      - name: Commit labels
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git commit -m 'Fix history delete dialog labels'
          git push
      - name: Start signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
