name: Show all Peugeot service items
on:
  push:
    paths:
      - '.github/scripts/show-all-service-items.py'
      - '.github/workflows/show-all-service-items.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Peugeot service tab patch
        run: python3 .github/scripts/show-all-service-items.py
      - name: Commit app change and remove helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html
          git rm .github/scripts/show-all-service-items.py
          git rm .github/workflows/show-all-service-items.yml
          git commit -m "Show all maintenance points in Peugeot service tab"
          git push
