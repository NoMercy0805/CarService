name: Grouped manual maintenance picker
on:
  push:
    paths:
      - '.github/scripts/patch-manual-picker.py'
      - '.github/workflows/manual-maintenance-picker.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply grouped picker patch
        run: python3 .github/scripts/patch-manual-picker.py
      - name: Commit app change and remove helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html
          git rm .github/scripts/patch-manual-picker.py
          git rm .github/workflows/manual-maintenance-picker.yml
          git commit -m "Replace native maintenance suggestions with grouped picker"
          git push
