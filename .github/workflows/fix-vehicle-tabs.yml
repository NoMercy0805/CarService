name: Fix vehicle tabs
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/fix-vehicle-tabs.yml' ]
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make vehicle tabs fit screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          new_block='''.vehicle-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:visible;padding:2px 2px 12px}.vehicle-tabs::-webkit-scrollbar{display:none}.vehicle-tab{min-width:0;width:100%;text-align:left;padding:12px 11px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);border:1px solid transparent;overflow:hidden}.vehicle-tab.active{border-color:var(--primary);background:var(--primary-soft)}.vehicle-tab strong{display:block;font-size:14px;line-height:1.2;white-space:normal}.vehicle-tab span{display:block;color:var(--muted);font-size:11px;line-height:1.3;margin-top:4px;white-space:normal;overflow-wrap:anywhere}'''
          s,n=re.subn(r'\.vehicle-tabs\{.*?\.vehicle-tab span\{[^}]*\}',new_block,s,count=1,flags=re.S)
          assert n==1, f'vehicle tab block matches: {n}'
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))' in s
          assert 'min-width:220px' not in s
          p.write_text(s)
          PY
      - name: Verify frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('app/src/main/assets/index.html').read_text()
          js=html.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/carservice.js').write_text(js)
          PY
          node --check /tmp/carservice.js
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-vehicle-tabs.yml
          git add app/src/main/assets/index.html
          git commit -m 'Fit both vehicle tabs on screen'
          git push
      - name: Start signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
