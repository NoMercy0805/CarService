name: Reference layout pass
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reference-layout-pass.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reference layout
        run: python3 scripts/reference-layout-pass.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S))
          Path('/tmp/carservice.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/carservice.js
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate Android release build
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify vehicle resources are packaged
        run: |
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | grep -E 'res/drawable.*/peugeot_(508|2008)' || { echo 'Vehicle drawables missing from APK'; exit 1; }
      - name: Commit refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html app/src/main/res/drawable/peugeot_508.jpg app/src/main/res/drawable/peugeot_2008.jpg
          git rm .github/workflows/reference-layout-pass.yml scripts/reference-layout-pass.py
          git commit -m "Match reference layout and package vehicle images as resources"
          git push
