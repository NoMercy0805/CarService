name: Simplify service tab

'on':
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Patch service UI
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Verify JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/carservice.js').write_text(js,encoding='utf-8')
          assert 'id="serviceModal"' not in s
          assert 'serviceTabOpenBtn' not in s
          assert 'serviceTabChecklistBtn' not in s
          assert 'id="serviceBaseList"' in s
          assert '#page-service [data-service-kind]:checked' in s
          assert '#page-service [data-service-task]:checked' in s
          assert 'renderServiceSummary' not in s
          PY
          node --check /tmp/carservice.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git commit -m 'Simplify next service and Peugeot checklist'
          git push
