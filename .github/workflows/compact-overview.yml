name: Compact CarService overview

on:
  push:
    paths:
      - '.github/workflows/compact-overview.yml'

permissions:
  contents: write

jobs:
  compact:
    if: github.repository == 'NoMercy0805/CarService'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simplify dashboard and 508 profile wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/assets/index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '.small-note{font-size:11px;color:var(--muted);line-height:1.5}\n',
              '.small-note{font-size:11px;color:var(--muted);line-height:1.5}\n.maintenance-details{margin:0 0 16px}.maintenance-details>summary{list-style:none;cursor:pointer;background:var(--surface2);box-shadow:var(--shadow);border-radius:16px;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.maintenance-details>summary::-webkit-details-marker{display:none}.maintenance-details>summary b{display:block;font-size:15px}.maintenance-details>summary small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.maintenance-details[open]>summary{margin-bottom:12px}.maintenance-details .section-head{margin-top:0}.profile-explain{background:var(--primary-soft);color:var(--ink);border-radius:13px;padding:11px 12px;margin-top:8px;font-size:11px;line-height:1.5}\n',
              'compact dashboard CSS')

          replace_once(
              '      <div class="section-head"><h3>Wartungsplan</h3><button id="openLogBtn">Erledigt eintragen</button></div>\n      <div class="chips" id="filterChips">\n        <button class="chip active" data-filter="all">Alle</button>\n        <button class="chip" data-filter="due">Fällig</button>\n        <button class="chip" data-filter="soon">Bald</button>\n        <button class="chip" data-filter="ok">Okay</button>\n        <button class="chip" data-filter="unknown">Offen</button>\n      </div>\n      <div class="task-list" id="taskList"></div>',
              '      <details class="maintenance-details" id="maintenanceDetails">\n        <summary><span><b>Wartungsplan</b><small>Alle Wartungspunkte und Intervalle</small></span><span>⌄</span></summary>\n        <div class="section-head"><h3>Alle Wartungen</h3><button id="openLogBtn">Erledigt eintragen</button></div>\n        <div class="chips" id="filterChips">\n          <button class="chip active" data-filter="all">Alle</button>\n          <button class="chip" data-filter="due">Fällig</button>\n          <button class="chip" data-filter="soon">Bald</button>\n          <button class="chip" data-filter="ok">Okay</button>\n          <button class="chip" data-filter="unknown">Offen</button>\n        </div>\n        <div class="task-list" id="taskList"></div>\n      </details>',
              'collapse maintenance plan')

          replace_once(
              '<div class="field" id="profileField"><label>Wartungsprofil</label><select id="settingsProfile" class="input"></select><div class="help" id="profileHelp"></div></div>',
              '<div class="field" id="profileField"><label id="profileLabel">Wartungsplan</label><select id="settingsProfile" class="input"></select><div class="help" id="profileHelp"></div><div class="profile-explain" id="profileExplain"></div></div>',
              'profile settings UI')

          replace_once(
              '  "508_early": "508: frühes 2012-Profil (bis ca. 06/2012)",\n  "508_late": "508: spätes 2012-Profil (ab ca. 07/2012)",\n  "2008_normal": "2008: normale Nutzung",\n  "2008_severe": "2008: erschwerte Nutzung"',
              '  "508_early": "Produktion bis 30.06.2012",\n  "508_late": "Produktion ab 01.07.2012",\n  "2008_normal": "Normale Nutzung",\n  "2008_severe": "Erschwerte Nutzung"',
              'profile labels')

          replace_once(
              '  document.getElementById("heroSub").innerHTML=`${esc(v.subtitle)} · ${esc(PROFILE_LABELS[v.profile])}<div class="vehicle-id">HSN/TSN ${esc(v.hsn)}/${esc(v.tsn)}${v.licensePlate?` · Kennzeichen ${esc(v.licensePlate)}`:""}${v.firstReg?` · EZ ${fmtDate(v.firstReg)}`:""}</div>`;',
              '  document.getElementById("heroSub").innerHTML=`${esc(v.subtitle)}<div class="vehicle-id">${v.licensePlate?`Kennzeichen ${esc(v.licensePlate)} · `:""}HSN/TSN ${esc(v.hsn)}/${esc(v.tsn)}${v.huDue?` · HU ${fmtDate(v.huDue)}`:""}</div>`;',
              'simplify hero metadata')

          replace_once(
              '  document.getElementById("profileHelp").textContent=v.id==="508"\n    ?"Bei 2012er 508 hängt der Wartungsplan vom Produktionsdatum ab. Das Profil sollte nach VIN/ORGA bzw. Serviceunterlagen gewählt werden."\n    :"Erschwerte Nutzung umfasst u. a. häufige Kurzstrecken, viel Stadtverkehr und staubige Einsatzbedingungen.";',
              '  document.getElementById("profileLabel").textContent=v.id==="508"?"Produktionszeitraum / Wartungsplan":"Nutzungsprofil";\n  document.getElementById("profileHelp").textContent=v.id==="508"\n    ?"Beim 508 zählt das Produktionsdatum bzw. die OPR/DAM-Nummer – nicht die Erstzulassung."\n    :"Erschwerte Nutzung umfasst u. a. häufige Kurzstrecken, viel Stadtverkehr und staubige Einsatzbedingungen.";\n  document.getElementById("profileExplain").innerHTML=v.id==="508"\n    ?(v.profile==="508_early"\n      ?"<b>Bis 30.06.2012 / OPR bis 13018:</b> Inspektion 30.000 km / 24 Monate · Zahnriemen 240.000 km / 10 Jahre."\n      :"<b>Ab 01.07.2012 / OPR ab 13019:</b> Inspektion 30.000 km / 12 Monate · Zahnriemen 180.000 km / 10 Jahre.")\n    :"<b>Normal:</b> 25.000 km / 12 Monate · <b>Erschwert:</b> 15.000 km / 12 Monate.";',
              'profile explanation')

          replace_once(
              '<p class="small-note">Die App ist eine Erinnerungs- und Dokumentationshilfe. Maßgeblich bleiben der fahrzeugspezifische Peugeot-Wartungsplan, VIN/Produktionsdatum, Betriebsbedingungen und Werkstatthinweise. Beim Peugeot 508 aus 2012 muss das passende Wartungsprofil ausgewählt werden.</p>',
              '<p class="small-note">Die App ist eine Erinnerungs- und Dokumentationshilfe. Beim Peugeot 508 von 2012 entscheidet der Produktionszeitraum bzw. die OPR/DAM-Nummer über den Wartungsplan. Die Erstzulassung allein ist dafür nicht zuverlässig.</p>',
              'interval note')

          path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = r.replace('Zwei auswählbare 2012er Wartungsprofile beim 508', 'Zwei Wartungspläne nach 508-Produktionszeitraum (bis 30.06.2012 / ab 01.07.2012)')
          r = r.replace('Deshalb bietet die App ein frühes und ein spätes 2012-Profil.', 'Deshalb unterscheidet die App zwischen Produktion bis 30.06.2012 (OPR/DAM bis 13018) und Produktion ab 01.07.2012 (OPR/DAM ab 13019).')
          readme.write_text(r, encoding='utf-8')
          PY

      - name: Verify UI and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'expected one inline script, found {len(scripts)}')
          Path('/tmp/carservice.js').write_text(scripts[0], encoding='utf-8')
          for required in ['maintenanceDetails','profileLabel','profileExplain','nextDueCard']:
              if f'id="{required}"' not in html:
                  raise SystemExit(f'missing required UI id: {required}')
          if 'frühes 2012-Profil' in html or 'spätes 2012-Profil' in html:
              raise SystemExit('old technical profile wording still present')
          PY
          node --check /tmp/carservice.js

      - name: Commit compact overview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html README.md
          git diff --cached --check
          git commit -m 'Simplify dashboard and 508 production profiles'
          git push
