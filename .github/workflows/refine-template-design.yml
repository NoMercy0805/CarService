name: Refine template design
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-template-design.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply design refinement
        run: python3 scripts/refine-template-design.py
      - name: Commit refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html
          git rm .github/workflows/refine-template-design.yml scripts/refine-template-design.py
          git commit -m "Refine app layout to match design template"
          git push
