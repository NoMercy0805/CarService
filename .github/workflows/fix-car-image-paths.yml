name: Fix car image paths
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-car-image-paths.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run image path patch
        run: python3 tools/fix_car_image_paths.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html
          git rm .github/workflows/fix-car-image-paths.yml tools/fix_car_image_paths.py
          git commit -m "Use absolute Android asset URLs for vehicle images"
          git push
