name: Apply CarService redesign
on:
  push:
    branches:
      - ui-redesign-final2
    paths:
      - tools/apply_ui.py
      - .github/workflows/apply-new-ui.yml
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply redesign
        run: python3 tools/apply_ui.py
      - name: Commit redesign
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html app/src/main/assets/peugeot-508.jpg app/src/main/assets/peugeot-2008.jpg
          git rm .github/workflows/apply-new-ui.yml tools/apply_ui.py
          git commit -m "Apply new CarService design"
          git push origin HEAD:ui-redesign-final2
