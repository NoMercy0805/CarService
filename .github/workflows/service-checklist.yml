name: Add Peugeot service checklist

on:
  push:
    paths:
      - '.github/workflows/service-checklist.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'NoMercy0805/CarService'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply service checklist patch
        run: python3 tools/patch_service_checklist.py

      - name: Verify JavaScript and diff
        run: |
          node --check /tmp/carservice.js
          git diff --check

      - name: Commit service checklist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html README.md
          git commit -m 'Add Peugeot-style service checklist'
          git push
