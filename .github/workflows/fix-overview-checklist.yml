name: Fix overview service checklist
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-overview-checklist.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/fix_overview_checklist.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html
          git rm tools/fix_overview_checklist.py .github/workflows/fix-overview-checklist.yml
          git commit -m "Make overview service items selectable"
          git push
