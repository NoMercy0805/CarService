name: Fix overview service checklist
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-overview-checklist.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch overview service checklist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()

          old='<div class="next-service-list" id="nextServiceList"></div>\n      </div>'
          new='<div class="next-service-list" id="nextServiceList"></div>\n        <button class="primary-btn overview-service-confirm" id="overviewConfirmServiceBtn" type="button" onclick="openOverviewServiceConfirm()">Service bestätigen</button>\n      </div>'
          if old not in s: raise SystemExit('overview list anchor not found')
          s=s.replace(old,new,1)

          start=s.find('function nextServiceGrouped(items){')
          end=s.find('\nfunction openServiceChecklist(){',start)
          if start<0 or end<0: raise SystemExit('nextServiceGrouped anchors not found')
          new_fn=r'''function nextServiceGrouped(items){
  const order=["Öl & Filter","Flüssigkeiten","Riemen","Abgas & AdBlue","Kontrollen","Weitere Arbeiten"];
  const groups={};
  items.forEach(item=>{const g=serviceGroupFor(item);(groups[g]||(groups[g]=[])).push(item);});
  return order.filter(g=>groups[g]?.length).map(g=>`<div class="service-group next-group"><div class="service-group-title">${esc(g)}</div>${groups[g].map(item=>`<label class="next-service-item next-service-check-row"><input type="checkbox" data-overview-service-task="${esc(item.id||item.taskId||"")}"><div><b>${esc(item.name)}</b><small>${esc(item.note)}</small></div></label>`).join("")}</div>`).join("");
}
let pendingOverviewServiceTasks=[];
function openOverviewServiceConfirm(){
  pendingOverviewServiceTasks=[...document.querySelectorAll('#page-dashboard [data-overview-service-task]:checked')].map(el=>el.dataset.overviewServiceTask).filter(Boolean);
  if(!pendingOverviewServiceTasks.length){alert("Bitte mindestens eine erledigte Arbeit abhaken.");return;}
  openServiceConfirm();
}'''
          s=s[:start]+new_fn+s[end:]

          old_checked='''  const checkedExtras=[...document.querySelectorAll('#page-service [data-service-task]:checked')].map(el=>el.dataset.serviceTask);'''
          new_checked='''  const checkedPageExtras=[...document.querySelectorAll('#page-service [data-service-task]:checked')].map(el=>el.dataset.serviceTask);\n  const checkedExtras=[...new Set([...checkedPageExtras,...pendingOverviewServiceTasks])].filter(taskId=>taskId&&taskId!=="service");'''
          if old_checked not in s: raise SystemExit('checkedExtras anchor not found')
          s=s.replace(old_checked,new_checked,1)

          old_tail='''  save();closeModal("serviceConfirmModal");renderAll();openServiceChecklist();alert("Service und ausgewählte Zusatzarbeiten gespeichert.");'''
          new_tail='''  pendingOverviewServiceTasks=[];\n  save();closeModal("serviceConfirmModal");renderAll();openServiceChecklist();alert("Service und ausgewählte Arbeiten gespeichert.");'''
          if old_tail not in s: raise SystemExit('save tail anchor not found')
          s=s.replace(old_tail,new_tail,1)

          old_render='''  list.innerHTML=dueItems.length\n    ?nextServiceGrouped(dueItems)\n    :`<div class="small-note">Aktuell ist keine Wartungsarbeit fällig oder bald fällig.</div>`;\n}'''
          new_render='''  list.innerHTML=dueItems.length\n    ?nextServiceGrouped(dueItems)\n    :`<div class="small-note">Aktuell ist keine Wartungsarbeit fällig oder bald fällig.</div>`;\n  const overviewConfirm=document.getElementById("overviewConfirmServiceBtn");\n  if(overviewConfirm) overviewConfirm.style.display=dueItems.length?"block":"none";\n}'''
          if old_render not in s: raise SystemExit('render tail anchor not found')
          s=s.replace(old_render,new_render,1)

          css=r'''
/* Overview service checklist interaction */
.next-service-item.next-service-check-row{grid-template-columns:30px 1fr;cursor:pointer;align-items:center}
.next-service-check-row input{width:22px;height:22px;margin:0;accent-color:var(--primary);cursor:pointer}
.next-service-check-row:active{background:var(--primary-soft)}
.overview-service-confirm{margin-top:14px}
'''
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)

          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/carservice.js').write_text('\n'.join(scripts))
          subprocess.run(['node','--check','/tmp/carservice.js'],check=True)
          for token in ['data-overview-service-task','overviewConfirmServiceBtn','openOverviewServiceConfirm','checkedPageExtras']:
              assert token in s, token
          print('Overview checklist fixed')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html
          git rm .github/workflows/fix-overview-checklist.yml
          git commit -m "Make overview service items selectable"
          git push
