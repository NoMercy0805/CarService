name: Fix maintenance plan sorting

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'NoMercy0805/CarService'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix grouping and brake presets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()

          old='const id=item.taskId||"";'
          new='const id=item.taskId||item.id||"";'
          assert old in s or new in s
          s=s.replace(old,new,1)

          if 'function nextServiceGrouped(items)' not in s:
              marker='function renderNextServicePlan(v){'
              helper='''function nextServiceGrouped(items){\n  const order=["Öl & Filter","Flüssigkeiten","Riemen","Abgas & AdBlue","Kontrollen","Weitere Arbeiten"];\n  const groups={};\n  items.forEach(item=>{const g=serviceGroupFor(item);(groups[g]||(groups[g]=[])).push(item);});\n  return order.filter(g=>groups[g]?.length).map(g=>`<div class="service-group"><div class="service-group-title">${esc(g)}</div>${groups[g].map(item=>`<div class="next-service-item"><b>${esc(item.name)}</b><small>${esc(item.note)}</small></div>`).join("")}</div>`).join("");\n}\n'''
              assert marker in s
              s=s.replace(marker,helper+marker,1)

          old_block='''  list.innerHTML=items.length\n    ?items.map(item=>`<div class="next-service-item"><b>${esc(item.name)}</b><small>${esc(item.note)}</small></div>`).join("")\n    :`<div class="small-note">Noch nicht berechenbar. Bitte Kilometerstand und Fahrzeugdaten ergänzen.</div>`;'''
          new_block='''  list.innerHTML=items.length\n    ?nextServiceGrouped(items)\n    :`<div class="small-note">Noch nicht berechenbar. Bitte Kilometerstand und Fahrzeugdaten ergänzen.</div>`;'''
          if old_block in s:
              s=s.replace(old_block,new_block,1)
          else:
              assert '?nextServiceGrouped(items)' in s or 'nextServiceGrouped(items)' in s

          anchor='''  "FAP-Additiv auffüllen",\n  "Bremsscheiben vorne ersetzen",'''
          replacement='''  "FAP-Additiv auffüllen",\n  "Bremsen komplett erneuern",\n  "Bremsen vorne komplett erneuern",\n  "Bremsen hinten komplett erneuern",\n  "Bremsscheiben vorne ersetzen",'''
          if '"Bremsen komplett erneuern"' not in s:
              assert anchor in s
              s=s.replace(anchor,replacement,1)

          p.write_text(s)
          assert 'const id=item.taskId||item.id||"";' in s
          assert 'function nextServiceGrouped(items)' in s
          assert '?nextServiceGrouped(items)' in s
          assert '"Bremsen komplett erneuern"' in s
          assert '"Bremsen vorne komplett erneuern"' in s
          assert '"Bremsen hinten komplett erneuern"' in s
          PY
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit app changes and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          git rm .github/workflows/fix-maintenance-plan-sorting.yml
          git commit -m "Fix maintenance plan grouping and expand brake presets"
          git push
