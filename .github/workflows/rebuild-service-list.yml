name: Rebuild Peugeot service list

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/rebuild-service-list.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply checked maintenance schedules
        run: |
          python3 .github/rebuild_service_list.py
          rm -f app/src/main/assets/service-icons/concept-sprite.webp

      - name: Verify frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text()
          js = html.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/carservice.js').write_text(js)
          PY
          node --check /tmp/carservice.js
          test ! -e app/src/main/assets/service-icons/concept-sprite.webp

      - name: Commit rebuild
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/rebuild-service-list.yml .github/rebuild_service_list.py
          git add -A
          git commit -m 'Rebuild Peugeot service checklist from maintenance schedules'
          git push

      - name: Start signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
