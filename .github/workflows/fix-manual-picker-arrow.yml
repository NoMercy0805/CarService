name: Fix manual picker arrow
on:
  push:
    paths:
      - '.github/workflows/fix-manual-picker-arrow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix arrow rotation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          old='.manual-picker-toggle span{font-size:20px;line-height:1;transition:transform .15s ease}.manual-picker-toggle.open span{transform:rotate(90deg)}'
          new='.manual-picker-toggle .manual-picker-arrow{font-size:20px;line-height:1;transition:transform .15s ease}.manual-picker-toggle.open .manual-picker-arrow{transform:rotate(90deg)}'
          if old not in s: raise SystemExit('old CSS not found')
          s=s.replace(old,new,1)
          old_html='<span class="manual-picker-label">Aus Wartungsliste auswählen</span><span>›</span>'
          new_html='<span class="manual-picker-label">Aus Wartungsliste auswählen</span><span class="manual-picker-arrow">›</span>'
          if old_html not in s: raise SystemExit('picker arrow HTML not found')
          s=s.replace(old_html,new_html,1)
          p.write_text(s)
          PY
      - name: Commit app change and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html
          git rm .github/workflows/fix-manual-picker-arrow.yml
          git commit -m "Fix manual maintenance picker arrow rotation"
          git push
