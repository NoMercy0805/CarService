name: Overview next service
on:
  push:
    paths:
      - '.github/scripts/overview-next-service.py'
      - '.github/workflows/overview-next-service.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply overview patch
        run: python3 .github/scripts/overview-next-service.py
      - name: Commit app change and remove helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/assets/index.html
          git rm .github/scripts/overview-next-service.py
          git rm .github/workflows/overview-next-service.yml
          git commit -m "Simplify overview to next due service items"
          git push
