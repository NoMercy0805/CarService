name: Rework next service planning

'on':
  push:
    paths:
      - '.github/workflows/next-service-plan.yml'

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    if: github.repository == 'NoMercy0805/CarService'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rework dashboard service planning
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/next_service_patch.py
          python3 /tmp/next_service_patch.py

      - name: Verify dashboard and JavaScript
        shell: bash
        run: |
          grep -q 'id="nextServiceList"' app/src/main/assets/index.html
          grep -q 'function renderNextServicePlan' app/src/main/assets/index.html
          ! grep -q 'id="countDue"' app/src/main/assets/index.html
          ! grep -q 'id="filterChips"' app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/app.js

      - name: Commit migration
        shell: bash
        run: |
          rm -f .github/workflows/next-service-plan.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show complete next-service plan on dashboard'
          git push origin HEAD:main

      - name: Start signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
