name: CarService navigation rework

'on':
  push:
    paths:
      - '.github/workflows/navigation-rework.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'NoMercy0805/CarService'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply navigation rework
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Verify UI and JavaScript
        run: |
          ! grep -q 'id="fab"' app/src/main/assets/index.html
          grep -q 'id="historyMenuBtn"' app/src/main/assets/index.html
          grep -q 'data-page="service"' app/src/main/assets/index.html
          grep -q 'id="serviceTabExtras"' app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>(.*)</script>', text, re.S).group(1)
          Path('/tmp/carservice.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/carservice.js

      - name: Commit navigation rework
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rework history and Peugeot service navigation"
          git push