name: CarService read-only hero migration

'on':
  push:
    paths:
      - '.github/workflows/hero-readonly-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'NoMercy0805/CarService'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make hero vehicle data read-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/assets/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
            '          <button id="editVehicleBtn">Bearbeiten</button>\n': '',
            '          <button id="quickKmBtn">km ändern</button>\n': '',
            'document.getElementById("editVehicleBtn").onclick=()=>openSettingsSection("settingsVehiclePanel");\n': '',
            'document.getElementById("quickKmBtn").onclick=()=>{document.getElementById("quickMileage").value=vehicle().mileage||"";openModal("kmModal");};\n': '',
            'document.getElementById("saveQuickKm").onclick=()=>{const n=Number(document.getElementById("quickMileage").value||0);if(n<0)return;vehicle().mileage=n;save();closeModal("kmModal");renderAll();};\n': ''
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected snippet: {old[:60]}')
              text = text.replace(old, new, 1)

          text, count = re.subn(
              r'\n<div class="modal-backdrop" id="kmModal">.*?(?=\n<div class="modal-backdrop" id="customModal">)',
              '',
              text,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit(f'km modal removal: expected 1 match, found {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify hero and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          for forbidden in ['editVehicleBtn','quickKmBtn','quickMileage','saveQuickKm','id="kmModal"']:
              if forbidden in html:
                  raise SystemExit(f'forbidden quick edit control remains: {forbidden}')
          for required in ['settingsMenuBtn','settingsVehiclePanel','settingsMileage','saveVehicleSettings','heroKm']:
              if required not in html:
                  raise SystemExit(f'missing required element: {required}')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'expected one inline script, found {len(scripts)}')
          Path('/tmp/carservice.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/carservice.js

      - name: Commit read-only hero
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git diff --cached --check
          git commit -m 'Keep vehicle editing in settings only'
          git push
